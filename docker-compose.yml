services:

  quizlab-db:
    image: postgres:17
    ports:
      - 5422:5432
    env_file:
      - .env
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - project_network

  quizlab:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 9080:9080
    env_file:
      - .env
    volumes:
      - ./data:/home/uv-app-user/app/data
    depends_on:
      - quizlab-db
    networks:
      - project_network

  # quizlab-frontend:
