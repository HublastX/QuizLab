services:

  quizlab-db:
    image: postgres:17
    ports:
      - 5422:5432
    env_file:
      - .env
    volumes:
      - quizlab-db-data:/var/lib/postgresql/data
    networks:
      - project_network

  quizlab:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 9080:9080
    env_file:
      - .env
    depends_on:
      - quizlab-db
    networks:
      - project_network

  quizlab-frontend:
    container_name: quizlab-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://quizlab:9080}
    restart: always
    ports:
      - 9081:9081
    env_file:
      - .env
    networks:
      - project_network

volumes:
  quizlab-db-data:

networks:
  project_network:
    external: true